name: Build Blackwell Serverless Image

on:
  workflow_dispatch:
    inputs:
      skip_models:
        description: "Build and push only the :code image (skip the ~42 GB model layers)"
        type: boolean
        default: false
      promote_tag:
        description: "Recovery: promote an existing staging tag straight to :latest (e.g. staging-4). Skips build and append entirely."
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# The append chain reuses fixed staging tags, so two runs must never overlap.
concurrency:
  group: build-blackwell-serverless
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/chrisditfort/minimax-h3-blackwell-serverless
  CODE_TAG: code
  FINAL_TAG: latest

jobs:
  # ------------------------------------------------------------------------------------
  # Stage 1: the slim code/runtime image. Fast, cacheable, no model weights.
  # ------------------------------------------------------------------------------------
  build-code:
    runs-on: ubuntu-latest
    if: ${{ inputs.promote_tag == '' || inputs.promote_tag == null }}
    outputs:
      code_ref: ${{ steps.push.outputs.code_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push code image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.CODE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record immutable code digest
        id: push
        run: |
          set -euo pipefail
          # Pin the exact digest so the append stage cannot race a newer :code push.
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "code_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Code image: ${ref}"

  # ------------------------------------------------------------------------------------
  # Stage 2: append the four FL2VA model weights, one layer at a time.
  #
  # Each model is streamed straight from Hugging Face into a tar layer (never stored twice)
  # verified against the exact size + sha256 the base image's own downloader uses, appended
  # to the remote image with crane, and then deleted before the next model starts. Peak
  # runner disk is therefore ~1x the largest model (21 GB) rather than 42 GB.
  # ------------------------------------------------------------------------------------
  append-models:
    needs: build-code
    # `needs` already skips this when build-code is skipped (promote mode), but state it
    # outright so the intent does not depend on that implicit behaviour.
    if: ${{ inputs.skip_models != true && (inputs.promote_tag == '' || inputs.promote_tag == null) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          set -euo pipefail
          echo "Before cleanup:"; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          echo "After cleanup:"; df -h / /mnt || true

      - name: Select work directory on the largest filesystem
        id: work
        run: |
          set -euo pipefail
          best_dir=""; best_free=0
          for candidate in /mnt /home/runner /tmp; do
            [ -d "$candidate" ] || continue
            free=$(df -B1 --output=avail "$candidate" | tail -1 | tr -d ' ')
            echo "  $candidate has $((free/1000000000)) GB free"
            if [ "$free" -gt "$best_free" ]; then best_free=$free; best_dir=$candidate; fi
          done
          # Largest model is ~21 GB; crane may buffer a compressed copy while pushing.
          if [ "$best_free" -lt 50000000000 ]; then
            echo "::error::Only $((best_free/1000000000)) GB free on $best_dir; need at least 50 GB."
            exit 1
          fi
          work="${best_dir}/h3-build"
          sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          echo "dir=${work}" >> "$GITHUB_OUTPUT"
          echo "Using work directory ${work} ($((best_free/1000000000)) GB free)"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          # --password-stdin keeps the token out of the process list and the log.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          echo "Authenticated to ${REGISTRY}"

      - name: Append model layers
        env:
          CODE_REF: ${{ needs.build-code.outputs.code_ref }}
          WORK: ${{ steps.work.outputs.dir }}
        run: |
          set -euo pipefail

          # crane buffers layers under TMPDIR while pushing; keep that off the small root fs.
          export TMPDIR="${WORK}/tmp"
          mkdir -p "$TMPDIR"

          current="${CODE_REF}"
          echo "Starting from ${current}"

          step=0
          while IFS=$'\t' read -r name url dest size sha; do
            case "$name" in ''|\#*) continue ;; esac
            step=$((step + 1))
            layer="${WORK}/${name}.tar"
            # Fixed (not run-scoped) staging tags: GHCR does not support manifest deletion
            # over the registry API, so run-scoped tags would accumulate forever. Reusing
            # the same names overwrites them instead. The workflow-level concurrency group
            # guarantees no two runs race on them.
            staging="${IMAGE}:staging-${step}"

            echo "::group::[${step}/4] ${name} -> /${dest}"
            python3 scripts/build_model_layer.py \
              --url "$url" --dest "$dest" --size "$size" --sha256 "$sha" --out "$layer"

            echo "Appending layer to ${staging} ..."
            crane append --base "$current" --new_layer "$layer" --new_tag "$staging"

            # Free the layer immediately so the next (possibly 21 GB) model has room.
            rm -f "$layer"
            current="$staging"
            df -h "$WORK" | tail -1
            echo "::endgroup::"
          done < models.tsv

          expected=$(grep -cvE '^\s*(#|$)' models.tsv)
          if [ "$step" -ne "$expected" ]; then
            echo "::error::Expected ${expected} model layers, appended ${step}. Check models.tsv."
            exit 1
          fi

          echo "final_ref=${current}" >> "$GITHUB_ENV"
          echo "All model layers appended: ${current}"

      - name: Verify the final image structure
        env:
          CODE_REF: ${{ needs.build-code.outputs.code_ref }}
        run: |
          set -euo pipefail
          # Content is already proven: every layer was checked against its exact byte size
          # and sha256 before being appended. This confirms the layers actually landed on
          # the right base, in order. Reads manifests only, so it costs a few KB rather
          # than re-downloading 43 GB.
          crane manifest "${CODE_REF}"   > /tmp/code-manifest.json
          crane manifest "${final_ref}"  > /tmp/final-manifest.json
          python3 scripts/verify_model_layers.py \
            --manifest /tmp/final-manifest.json \
            --code-manifest /tmp/code-manifest.json \
            --models models.tsv

      - name: Publish final image
        run: |
          set -euo pipefail
          crane tag "${final_ref}" "${FINAL_TAG}"
          crane tag "${final_ref}" "sha-${GITHUB_SHA::12}"
          digest=$(crane digest "${IMAGE}:${FINAL_TAG}")
          echo "Published ${IMAGE}:${FINAL_TAG}"
          echo "Digest    ${digest}"
          {
            echo "### MiniMax H3 Blackwell serverless image"
            echo
            echo '```'
            echo "${IMAGE}:${FINAL_TAG}"
            echo "${IMAGE}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report staging tags
        if: always()
        run: |
          set -euo pipefail
          # GHCR rejects manifest DELETE over the registry API, so `crane delete` cannot
          # remove these. Rather than pretend to clean up (an earlier version swallowed the
          # failure and logged a misleading "Skipped"), the tags are simply reused by the
          # next run. Keeping them is actively useful: if a later step fails, the finished
          # image survives and can be promoted with the promote_tag input instead of
          # re-downloading 42 GB.
          echo "Staging tags retained (reused by the next run):"
          for step in $(seq 1 "$(grep -cvE '^\s*(#|$)' models.tsv)"); do
            echo "  ${IMAGE}:staging-${step}"
          done
          echo
          echo "To promote one manually without rebuilding:"
          echo "  gh workflow run build.yml -f promote_tag=staging-4"
          echo "Prune them from the GitHub package UI if they ever need to go."

  # ------------------------------------------------------------------------------------
  # Recovery path: promote an already-appended staging tag straight to :latest.
  #
  # The append chain leaves a complete image behind at staging-4. If a later step fails
  # (or :latest needs rolling back to a previous append), this re-tags it in seconds
  # instead of re-downloading and re-compressing 42 GB.
  # ------------------------------------------------------------------------------------
  promote:
    if: ${{ inputs.promote_tag != '' && inputs.promote_tag != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Verify the staging image before promoting it
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE}:${PROMOTE_TAG}"
          echo "Promoting ${source_ref} -> ${IMAGE}:${FINAL_TAG}"

          # Never promote blind: run the same structural check the normal path runs.
          crane manifest "${IMAGE}:${CODE_TAG}" > /tmp/code-manifest.json
          crane manifest "${source_ref}"        > /tmp/final-manifest.json
          python3 scripts/verify_model_layers.py \
            --manifest /tmp/final-manifest.json \
            --code-manifest /tmp/code-manifest.json \
            --models models.tsv

          echo "source_ref=${source_ref}" >> "$GITHUB_ENV"

      - name: Publish as :latest
        run: |
          set -euo pipefail
          crane tag "${source_ref}" "${FINAL_TAG}"
          crane tag "${source_ref}" "sha-${GITHUB_SHA::12}"
          digest=$(crane digest "${IMAGE}:${FINAL_TAG}")
          echo "Published ${IMAGE}:${FINAL_TAG}"
          echo "Digest    ${digest}"
          {
            echo "### Promoted ${{ inputs.promote_tag }} to :latest"
            echo
            echo '```'
            echo "${IMAGE}:${FINAL_TAG}"
            echo "${IMAGE}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
