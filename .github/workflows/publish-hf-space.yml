name: Publish model-free worker to Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Full immutable Git commit containing the slim worker source"
        type: string
        required: true
      execute_publish:
        description: "Upload the allowlisted source to the private Space"
        type: boolean
        required: true
        default: false
      wait_for_build:
        description: "Wait for the remote Docker build and inspect registry metadata"
        type: boolean
        required: true
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-privora-h3-hf-space
  cancel-in-progress: false

env:
  HF_SPACE_REPO: CDitfort/privora-h3-runpod-worker
  HF_OIDC_RESOURCE: spaces/CDitfort/privora-h3-runpod-worker
  PYTHONUNBUFFERED: "1"

jobs:
  validate-publish-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the immutable slim-worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1

      - name: Verify the selected source revision
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          if [[ ! "${{ inputs.source_revision }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_revision must be a full lowercase Git commit SHA"
            exit 1
          fi
          if [[ "$resolved" != "${{ inputs.source_revision }}" ]]; then
            echo "::error::Checkout resolved to an unexpected source revision"
            exit 1
          fi
          echo "Validated immutable source revision: $resolved"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and Hugging Face tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r scripts/requirements-hf-space.txt \
            requests websocket-client boto3 cryptography

      - name: Run the full Python regression suite
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run the JavaScript privacy and routing suites
        shell: bash
        run: >-
          node --test
          worker.test.js
          worker.internal.test.js
          worker.routes.test.js
          worker.delete.test.js
          worker.confidential.test.js
          client/confidential-generation.test.js

      - name: Stage only approved Space build source
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/privora-h3-space-source"
          python scripts/stage_hf_space.py \
            --source-root . \
            --output "$staging" \
            --source-commit "$(git rev-parse HEAD)" \
            --build-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --space-repository "$HF_SPACE_REPO"
          python scripts/guard_no_model_weights.py \
            --manifest "$staging/models/h3-cache-manifest.json" \
            --root "$staging" \
            --max-bytes 0
          echo "staging=$staging" >> "$GITHUB_OUTPUT"

      - name: Exchange GitHub OIDC for a short-lived Space token
        shell: bash
        run: |
          set -euo pipefail
          unset HF_TOKEN || true
          token="$(hf auth token)"
          if [[ -z "$token" ]]; then
            echo "::error::Hugging Face OIDC exchange returned an empty token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "HF_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Hugging Face OIDC exchange succeeded"

      - name: Credentialed dry-run validation
        shell: bash
        run: >-
          python scripts/publish_hf_space.py
          --folder "${{ steps.stage.outputs.staging }}"
          --repo "$HF_SPACE_REPO"
          --check-only

      - name: Publish approved source to the private Space
        if: ${{ inputs.execute_publish }}
        id: publish
        shell: bash
        run: >-
          python scripts/publish_hf_space.py
          --folder "${{ steps.stage.outputs.staging }}"
          --repo "$HF_SPACE_REPO"
          --commit-message "Publish Privora H3 slim worker from ${{ inputs.source_revision }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Wait for the remote Space build
        if: ${{ inputs.execute_publish && inputs.wait_for_build }}
        id: space
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            unset HF_TOKEN || true
            token="$(hf auth token)"
            echo "::add-mask::$token"
            export HF_TOKEN="$token"
            set +e
            python scripts/inspect_hf_space.py \
              --repo "$HF_SPACE_REPO" \
              --revision "${{ steps.publish.outputs.space_revision }}" \
              --github-output "$GITHUB_OUTPUT"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            if [[ $status -ne 10 ]]; then
              exit "$status"
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the Hugging Face Space build"
          exit 1

      - name: Install crane for registry metadata only
        if: ${{ inputs.execute_publish && inputs.wait_for_build }}
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Inspect immutable image metadata without pulling layers
        if: ${{ inputs.execute_publish && inputs.wait_for_build && steps.space.outputs.registry_ref != 'unavailable' }}
        id: registry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unset HF_TOKEN || true
          token="$(hf auth token)"
          echo "::add-mask::$token"
          export HF_TOKEN="$token"
          printf '%s' "$token" | crane auth login registry.hf.space \
            --username CDitfort --password-stdin
          registry_ref="${{ steps.space.outputs.registry_ref }}"
          digest="$(crane digest --platform linux/amd64 "$registry_ref")"
          crane manifest --platform linux/amd64 "$registry_ref" > "$RUNNER_TEMP/image-manifest.json"
          crane config --platform linux/amd64 "$registry_ref" > "$RUNNER_TEMP/image-config.json"
          python scripts/report_image_manifest.py \
            --manifest "$RUNNER_TEMP/image-manifest.json" \
            --config "$RUNNER_TEMP/image-config.json" \
            --digest "$digest" \
            --registry-ref "$registry_ref" \
            --github-output "$GITHUB_OUTPUT"

      - name: Write safe workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Privora H3 model-free Space publication"
            echo ""
            echo "- source revision: \`${{ inputs.source_revision }}\`"
            echo "- Space: \`$HF_SPACE_REPO\`"
            echo "- execute_publish: \`${{ inputs.execute_publish }}\`"
            echo "- model-weight files staged: \`0\`"
            echo "- model bytes staged: \`0\`"
            echo "- Space revision: \`${{ steps.publish.outputs.space_revision || 'not published' }}\`"
            echo "- Space stage: \`${{ steps.space.outputs.space_stage || 'not inspected' }}\`"
            echo "- registry reference: \`${{ steps.space.outputs.registry_ref || 'not inspected' }}\`"
            echo "- registry metadata probe: \`${{ steps.registry.outcome || 'not run' }}\`"
            echo "- image digest: \`${{ steps.registry.outputs.image_digest || 'not exposed' }}\`"
            echo "- compressed bytes: \`${{ steps.registry.outputs.compressed_bytes || 'not measured' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
