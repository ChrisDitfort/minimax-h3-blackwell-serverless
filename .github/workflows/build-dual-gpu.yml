name: Build Experimental Dual-GPU Image

# Publishes the experimental 2-GPU MiniMax H3 worker under a NEW immutable tag.
#
# It never touches :latest, :code or the staging-N tags, so the known-good image and the
# rollback path this repository already relies on stay exactly where they are. It only
# ever writes to a tag that does not exist yet, and refuses to run if it does.
#
# Two ways to get the models into the image:
#
#   rebase (default)  Take the known-good image, which already carries all model
#                     layers, and swap the code layers underneath them for freshly built
#                     ones. Two minutes, no downloads, and the result provably differs
#                     from the known-good image by nothing but this repository's code.
#
#   full_rebuild      Stream every file in models.tsv from Hugging Face and append it to
#                     the new code image, exactly as build.yml does. Use it
#                     if the base image ever stops being rebasable.

# `push` on the experiment branch as well as manual dispatch, and deliberately so:
# GitHub only offers workflow_dispatch for workflows that exist on the *default* branch,
# and putting this file on main would fire build.yml's `on: push` and overwrite :latest
# with an image built from main. Publishing here is still safe to do on every push - the
# target tag is immutable, so a second push to the same tag fails the build instead of
# replacing a benchmarked image.
on:
  push:
    branches:
      - dual-gpu-experiment
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "New immutable tag to publish. Blank uses DEFAULT_TAG below. Must not be latest/code/staging-*."
        type: string
        required: false
        default: ""
      base_tag:
        description: "Known-good image to take the model layers from."
        type: string
        default: "multimodal-1"
      old_code_tag:
        description: "The code image base_tag was built on. Only used by the rebase path."
        type: string
        default: "code-multimodal-1"
      full_rebuild:
        description: "Re-download and append every models.tsv layer instead of rebasing."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dual-gpu
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/chrisditfort/minimax-h3-blackwell-serverless
  # A push event carries no inputs, so every input needs a fallback here.
  DEFAULT_TAG: multimodal-3
  DEFAULT_BASE_TAG: multimodal-1
  DEFAULT_OLD_CODE_TAG: code-multimodal-1
  # multimodal-1 now carries every weight in models.tsv, so a rebase is the right way to
  # put new code under them: two minutes instead of another 69 GB of downloads.
  DEFAULT_FULL_REBUILD: "false"

jobs:
  # ------------------------------------------------------------------------------------
  # Stage 1: the slim code image, built from this branch, pushed to its own tag.
  #
  # Deliberately NOT :code. Overwriting :code would destroy the reference the rebase path
  # needs to reconstruct the known-good image, which is the rollback story.
  # ------------------------------------------------------------------------------------
  build-code:
    runs-on: ubuntu-latest
    outputs:
      code_ref: ${{ steps.record.outputs.code_ref }}
      code_tag: ${{ steps.guard.outputs.code_tag }}
      tag: ${{ steps.guard.outputs.tag }}
      full_rebuild: ${{ steps.guard.outputs.full_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to publish over a protected or existing tag
        id: guard
        env:
          TAG_INPUT: ${{ inputs.tag }}
          FULL_REBUILD_INPUT: ${{ inputs.full_rebuild }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-$DEFAULT_TAG}"
          case "$TAG" in
            latest|code|staging-*|"")
              echo "::error::Refusing to publish to '${TAG}'. That tag is the known-good image or part of its build chain."
              exit 1
              ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,62}$'; then
            echo "::error::'${TAG}' is not a valid lowercase OCI tag."
            exit 1
          fi
          # Job-level `if` cannot read `env`, so the effective value is resolved here
          # and published as an output the dependent jobs can gate on.
          FULL_REBUILD="${FULL_REBUILD_INPUT:-$DEFAULT_FULL_REBUILD}"
          echo "full_rebuild=${FULL_REBUILD}" >> "$GITHUB_OUTPUT"
          echo "Model layers: $([ "$FULL_REBUILD" = "true" ] && echo "full append" || echo "rebase")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "code_tag=code-${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing experimental image to ${IMAGE}:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Fail if the target tag already exists
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          # Immutability is the point: a benchmark run has to be attributable to exactly
          # one image, so a tag is never reused.
          if crane digest "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${TAG} already exists. Pick a new tag; experimental tags are immutable."
            exit 1
          fi
          echo "${IMAGE}:${TAG} is free."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the code image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.guard.outputs.code_tag }}
          build-args: |
            H3_BUILD_SOURCE_COMMIT=${{ github.sha }}
            H3_BUILD_IMAGE_TAG=${{ steps.guard.outputs.tag }}
            H3_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Record the immutable code digest
        id: record
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "code_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Code image: ${ref}"

  # ------------------------------------------------------------------------------------
  # Stage 2a: rebase the known-good image onto the new code layers (the fast path).
  # ------------------------------------------------------------------------------------
  rebase:
    needs: build-code
    if: ${{ needs.build-code.outputs.full_rebuild != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Pin the known-good image and its code base
        id: pin
        env:
          BASE_TAG_INPUT: ${{ inputs.base_tag }}
          OLD_CODE_TAG_INPUT: ${{ inputs.old_code_tag }}
        run: |
          set -euo pipefail
          BASE_TAG="${BASE_TAG_INPUT:-$DEFAULT_BASE_TAG}"
          OLD_CODE_TAG="${OLD_CODE_TAG_INPUT:-$DEFAULT_OLD_CODE_TAG}"
          base_digest=$(crane digest "${IMAGE}:${BASE_TAG}")
          old_code_digest=$(crane digest "${IMAGE}:${OLD_CODE_TAG}")
          echo "base=${IMAGE}@${base_digest}"          >> "$GITHUB_OUTPUT"
          echo "old_base=${IMAGE}@${old_code_digest}"  >> "$GITHUB_OUTPUT"
          {
            echo "### Rollback reference"
            echo
            echo '```'
            echo "known-good : ${IMAGE}:${BASE_TAG}"
            echo "digest     : ${base_digest}"
            echo "code base  : ${IMAGE}:${OLD_CODE_TAG}"
            echo "digest     : ${old_code_digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rebase the model layers onto the new code
        id: rebase
        env:
          BASE: ${{ steps.pin.outputs.base }}
          OLD_BASE: ${{ steps.pin.outputs.old_base }}
          NEW_BASE: ${{ needs.build-code.outputs.code_ref }}
        run: |
          set -euo pipefail
          # Keeps the large model layers byte-for-byte and swaps only the code
          # layers beneath them, so the experimental image differs from the known-good one
          # by this repository's source and nothing else.
          # The image to rebase is positional in current crane; --original was removed.
          # Untagged on purpose: the result is not publishable until its config has been
          # brought across too (next step), and tagging it here would burn the tag.
          rebased=$(crane rebase "${BASE}" \
            --old_base "${OLD_BASE}" \
            --new_base "${NEW_BASE}")
          echo "rebased=${rebased}" >> "$GITHUB_OUTPUT"
          echo "Rebased image: ${rebased}"

      - name: Carry the new image's environment defaults across
        id: publish_tag
        env:
          TAG: ${{ needs.build-code.outputs.tag }}
          REBASED: ${{ steps.rebase.outputs.rebased }}
          NEW_BASE: ${{ needs.build-code.outputs.code_ref }}
        run: |
          set -euo pipefail
          # crane rebase swaps layers but keeps the *original* image's config, so the
          # Dockerfile's new ENV block does not survive it. Copy every H3_/NCCL_ variable
          # off the freshly built code image rather than restating them here, so this step
          # cannot drift away from the Dockerfile.
          crane config "${NEW_BASE}" > /tmp/new-code-config.json
          python3 - <<'PY' > /tmp/mutate-args
          import json

          config = json.load(open("/tmp/new-code-config.json"))["config"]
          for entry in config.get("Env") or []:
              if "=" not in entry:
                  continue
              key = entry.split("=", 1)[0]
              if (key.startswith("H3_") or key.startswith("NCCL_")
                      or key == "COMFYUI_H3_COMMIT"):
                  print("--env")
                  print(entry)
          PY
          mapfile -t MUTATE_ARGS < /tmp/mutate-args
          echo "Applying: ${MUTATE_ARGS[*]:-<none>}"
          crane mutate "${REBASED}" "${MUTATE_ARGS[@]}" -t "${IMAGE}:${TAG}"
          digest=$(crane digest "${IMAGE}:${TAG}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify the model layers survived the rebase
        env:
          TAG: ${{ needs.build-code.outputs.tag }}
          NEW_BASE: ${{ needs.build-code.outputs.code_ref }}
        run: |
          set -euo pipefail
          crane manifest "${NEW_BASE}"      > /tmp/code-manifest.json
          crane manifest "${IMAGE}:${TAG}"  > /tmp/final-manifest.json
          python3 scripts/verify_model_layers.py \
            --manifest /tmp/final-manifest.json \
            --code-manifest /tmp/code-manifest.json \
            --models models.tsv

      - name: Verify the entrypoint and the default GPU mode
        env:
          TAG: ${{ needs.build-code.outputs.tag }}
        run: |
          set -euo pipefail
          # A rebase that lost the handler entrypoint, or that shipped defaulting to dual,
          # would be worse than no image at all.
          crane config "${IMAGE}:${TAG}" > /tmp/config.json
          python3 - <<'PY'
          import json, sys
          config = json.load(open("/tmp/config.json"))["config"]
          entrypoint = config.get("Entrypoint") or []
          env = dict(item.split("=", 1) for item in (config.get("Env") or []) if "=" in item)
          problems = []
          if entrypoint != ["python3", "/opt/serverless/handler.py"]:
              problems.append(f"unexpected entrypoint {entrypoint}")
          if env.get("H3_GPU_MODE") != "single":
              problems.append(f"H3_GPU_MODE defaults to {env.get('H3_GPU_MODE')!r}, expected 'single'")
          if problems:
              sys.exit("image check failed: " + "; ".join(problems))
          print("entrypoint and H3_GPU_MODE default are correct")
          PY

      - name: Publish the result
        env:
          TAG: ${{ needs.build-code.outputs.tag }}
          DIGEST: ${{ steps.publish_tag.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Experimental dual-GPU image"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${DIGEST}"
            echo "source commit ${GITHUB_SHA}"
            echo '```'
            echo
            echo "Release it on RunPod with 2 GPUs per worker and \`H3_GPU_MODE=dual\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${IMAGE}:${TAG} (${DIGEST})"

  # ------------------------------------------------------------------------------------
  # Stage 2b: the from-scratch path. Same streaming append chain as build.yml, but every
  # tag it touches is scoped to this experiment.
  # ------------------------------------------------------------------------------------
  append-models:
    needs: build-code
    if: ${{ needs.build-code.outputs.full_rebuild == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache || true
          sudo docker image prune -af || true
          df -h / /mnt || true

      - name: Select work directory on the largest filesystem
        id: work
        run: |
          set -euo pipefail
          best_dir=""; best_free=0
          for candidate in /mnt /home/runner /tmp; do
            [ -d "$candidate" ] || continue
            free=$(df -B1 --output=avail "$candidate" | tail -1 | tr -d ' ')
            if [ "$free" -gt "$best_free" ]; then best_free=$free; best_dir=$candidate; fi
          done
          if [ "$best_free" -lt 50000000000 ]; then
            echo "::error::Only $((best_free/1000000000)) GB free on $best_dir; need at least 50 GB."
            exit 1
          fi
          work="${best_dir}/h3-build"
          sudo mkdir -p "$work" && sudo chown "$(id -u):$(id -g)" "$work"
          echo "dir=${work}" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | crane auth login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Append model layers
        env:
          CODE_REF: ${{ needs.build-code.outputs.code_ref }}
          WORK: ${{ steps.work.outputs.dir }}
          TAG: ${{ needs.build-code.outputs.tag }}
        run: |
          set -euo pipefail
          export TMPDIR="${WORK}/tmp"
          mkdir -p "$TMPDIR"

          current="${CODE_REF}"
          step=0
          while IFS=$'\t' read -r name url dest size sha; do
            case "$name" in ''|\#*) continue ;; esac
            step=$((step + 1))
            layer="${WORK}/${name}.tar"
            # Experiment-scoped staging tags: build.yml's staging-N tags belong to the
            # known-good chain and must not be disturbed.
            staging="${IMAGE}:staging-${TAG}-${step}"

            echo "::group::[${step}] ${name} -> /${dest}"
            python3 scripts/build_model_layer.py \
              --url "$url" --dest "$dest" --size "$size" --sha256 "$sha" --out "$layer"
            crane append --base "$current" --new_layer "$layer" --new_tag "$staging"
            rm -f "$layer"
            current="$staging"
            echo "::endgroup::"
          done < models.tsv

          expected=$(grep -cvE '^\s*(#|$)' models.tsv)
          if [ "$step" -ne "$expected" ]; then
            echo "::error::Expected ${expected} model layers, appended ${step}."
            exit 1
          fi
          echo "final_ref=${current}" >> "$GITHUB_ENV"

      - name: Verify the final image structure
        env:
          CODE_REF: ${{ needs.build-code.outputs.code_ref }}
        run: |
          set -euo pipefail
          crane manifest "${CODE_REF}"  > /tmp/code-manifest.json
          crane manifest "${final_ref}" > /tmp/final-manifest.json
          python3 scripts/verify_model_layers.py \
            --manifest /tmp/final-manifest.json \
            --code-manifest /tmp/code-manifest.json \
            --models models.tsv

      - name: Publish the result
        env:
          TAG: ${{ needs.build-code.outputs.tag }}
        run: |
          set -euo pipefail
          crane tag "${final_ref}" "${TAG}"
          digest=$(crane digest "${IMAGE}:${TAG}")
          {
            echo "### Experimental dual-GPU image (full rebuild)"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}@${digest}"
            echo "source commit ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${IMAGE}:${TAG} (${digest})"
